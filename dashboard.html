<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLOWS-PRO Dashboard</title>

<!-- CHART -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- LEAFLET -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

/* ================= RESET ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  background:#f4f6f9;
}

/* ================= NAVBAR ================= */

.navbar{
  position:fixed;
  width:100%;
  background:linear-gradient(90deg,#7b2ff7,#00c6ff);
  z-index:1000;
}

.navbar-inner{
  max-width:1200px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:white;
  font-size:24px;
  font-weight:bold;
}

/* ================= USER ================= */

.user-box{
  display:flex;
  align-items:center;
  gap:10px;
  color:white;
  cursor:pointer;
  position:relative;
}

.user-box img{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
}

.user-box span{
  max-width:160px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* ================= DROPDOWN ================= */

.dropdown{
  position:absolute;
  top:55px;
  right:0;
  background:white;
  color:black;
  border-radius:10px;
  padding:10px;
  display:none;
  min-width:140px;
  box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

.dropdown div{
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}

.dropdown div:hover{
  background:#f1f1f1;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
  z-index:9999;
}

.modal-box{
  width:320px;
  background:white;
  border-radius:15px;
  padding:25px;
  text-align:center;
}

.modal-box h3{
  margin-bottom:15px;
}

.modal-box img{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  margin-bottom:15px;
}

.modal-box input{
  width:100%;
  padding:10px;
  margin-bottom:12px;
  border-radius:8px;
  border:1px solid #ccc;
}

.modal-box button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#00c6ff;
  color:white;
  cursor:pointer;
}

/* ================= CONTENT ================= */

.container{
  max-width:1200px;
  margin:auto;
  padding:110px 25px 30px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

/* CARD */
.card{
  background:white;
  border-radius:15px;
  padding:20px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.value{
  font-size:30px;
  font-weight:bold;
  margin-top:10px;
}

/* STATUS */
.aman{color:#2ecc71;}
.waspada{color:#f39c12;}
.bahaya{color:#e74c3c;}

/* PROGRESS */
.progress{
  width:100%;
  height:10px;
  background:#eee;
  border-radius:10px;
  margin-top:15px;
}

.progress-bar{
  width:0%;
  height:10px;
  background:#00c6ff;
  border-radius:10px;
}

/* ROW */
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-top:25px;
}

/* MAP */
#map{
  height:350px;
  border-radius:12px;
}

/* RESPONSIVE */
@media(max-width:900px){

  .grid{
    grid-template-columns:1fr;
  }

  .row{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<!-- ================= NAVBAR ================= -->

<div class="navbar">
  <div class="navbar-inner">

    <div class="logo">FLOWS-PRO</div>

    <div class="user-box" onclick="toggleMenu()">

      <img id="userPhoto">

      <span id="userName"></span>

      <div id="dropdown" class="dropdown">
        <div onclick="openEdit()">Edit Akun</div>
        <div onclick="logout()">Logout</div>
      </div>

    </div>

  </div>
</div>

<!-- ================= MODAL ================= -->

<div id="modal" class="modal">

  <div class="modal-box">

    <h3>Edit Akun</h3>

    <img id="previewPhoto">

    <input type="file" id="photoInput">

    <input type="text" id="editName" placeholder="Nama baru">

    <button onclick="saveEdit()">Simpan</button>

  </div>

</div>

<!-- ================= CONTENT ================= -->

<div class="container">

  <div class="grid">

    <div class="card">
      <h3>Tinggi Air</h3>

      <div id="tinggi" class="value">0 cm</div>

      <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </div>

    <div class="card">
      <h3>Status</h3>

      <div id="status" class="value aman">AMAN</div>
    </div>

    <div class="card">
      <h3>Water Sensor</h3>

      <div id="water" class="value">KERING</div>
    </div>

  </div>

  <div class="row">

    <div class="card">
      <h3>Grafik Realtime</h3>
      <canvas id="chart"></canvas>
    </div>

    <div class="card">
      <h3>Lokasi Sensor</h3>
      <div id="map"></div>
    </div>

  </div>

</div>

<script>

/* ================= SUPABASE ================= */

const supabase = window.supabase.createClient(
  "https://hceblnmngnnexxtkeiev.supabase.co",
  "MASUKKAN_API_KEY_KAMU"
);

/* ================= USER ================= */

let user = JSON.parse(localStorage.getItem("user"));

if(!user){
  window.location.href="login.html";
}

function loadUser(){

  userName.innerText = user.name || "User";

  userPhoto.src =
    user.photo || "https://i.pravatar.cc/150";
}

loadUser();

/* ================= MENU ================= */

function toggleMenu(){

  dropdown.style.display =
  dropdown.style.display==="block"
  ? "none"
  : "block";
}

/* ================= LOGOUT ================= */

function logout(){

  localStorage.removeItem("user");

  window.location.href="index.html";
}

/* ================= EDIT ================= */

function openEdit(){

  modal.style.display="flex";

  editName.value = user.name;

  previewPhoto.src = user.photo;
}

/* PREVIEW FOTO */

photoInput.addEventListener("change", function(){

  const file = this.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    previewPhoto.src = e.target.result;
  };

  reader.readAsDataURL(file);
});

/* SAVE */

function saveEdit(){

  user.name = editName.value;

  user.photo = previewPhoto.src;

  localStorage.setItem(
    "user",
    JSON.stringify(user)
  );

  loadUser();

  modal.style.display="none";
}

/* CLOSE MODAL */

modal.addEventListener("click",(e)=>{

  if(e.target===modal){

    modal.style.display="none";
  }

});

/* ================= MAP ================= */

let map = L.map('map')
.setView([1.666,101.45],13);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

let marker;

/* ================= CHART ================= */

let chart = new Chart(
document.getElementById("chart"),{

  type:"line",

  data:{
    labels:[],
    datasets:[{
      label:"Tinggi Air",
      data:[],
      borderColor:"#00c6ff",
      borderWidth:3,
      tension:0.4
    }]
  },

  options:{
    responsive:true,
    plugins:{
      legend:{
        display:false
      }
    }
  }

});

/* ================= UPDATE UI ================= */

function updateDashboard(data){

  /* CARD */
  tinggi.innerText =
    data.tinggi_air + " cm";

  water.innerText =
    data.water_level;

  status.innerText =
    data.status;

  status.className="value";

  if(data.status==="AMAN"){
    status.classList.add("aman");
  }
  else if(data.status==="WASPADA"){
    status.classList.add("waspada");
  }
  else{
    status.classList.add("bahaya");
  }

  /* PROGRESS */
  progressBar.style.width =
    data.tinggi_air + "%";

  /* CHART */
  chart.data.labels.push(
    new Date().toLocaleTimeString()
  );

  chart.data.datasets[0].data.push(
    data.tinggi_air
  );

  if(chart.data.labels.length > 10){

    chart.data.labels.shift();

    chart.data.datasets[0].data.shift();
  }

  chart.update();

  /* MAP */

  if(marker){
    map.removeLayer(marker);
  }

  marker = L.marker([
    data.latitude,
    data.longitude
  ])
  .addTo(map)
  .bindPopup(`
    <b>Status:</b> ${data.status}<br>
    <b>Tinggi:</b> ${data.tinggi_air} cm
  `);

  map.setView([
    data.latitude,
    data.longitude
  ],13);

}

/* ================= LOAD DATA AWAL ================= */

async function loadLatest(){

  const { data, error } = await supabase
  .from("data_air")
  .select("*")
  .order("id",{ascending:false})
  .limit(1);

  if(data && data.length > 0){

    updateDashboard(data[0]);
  }

}

loadLatest();

/* ================= REALTIME ================= */

supabase
.channel("realtime-air")
.on(
  "postgres_changes",
  {
    event:"INSERT",
    schema:"public",
    table:"data_air"
  },

  (payload)=>{

    console.log(payload);

    updateDashboard(payload.new);

  }

)
.subscribe();

</script>

</body>
</html>
