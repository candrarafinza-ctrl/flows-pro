<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar - FLOWS PRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:#000;
}

/* BACKGROUND */
body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:url('Desain tanpa judul (1).png') center/cover;
filter:brightness(.6);
animation:zoomBg 6s ease forwards;
}

/* CONTAINER */
.container{
position:relative;
z-index:2;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* FORM BOX */
.form-box{
width:90%;
max-width:500px;

background:rgba(255,255,255,.15);
backdrop-filter:blur(25px);
border:1px solid rgba(255,255,255,.3);

border-radius:25px;
padding:40px;
color:white;

animation:fadeUp 1s ease;
}

.form-box h2{
text-align:center;
margin-bottom:25px;
}

/* INPUT */
.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:15px;
}

.input-group label{
display:block;
margin-bottom:6px;
}

.input-group input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
outline:none;
font-size:15px;
}

/* BUTTON */
.btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
background:linear-gradient(
90deg,
#00c6ff,
#0072ff
);
color:white;
font-size:16px;
transition:.3s;
}

.btn:hover{
transform:scale(1.03);
}

.google{
margin-top:12px;
background:white;
color:#222;
}

/* LINK */
.link{
text-align:center;
margin-top:18px;
}

.link a{
color:white;
text-decoration:underline;
}

/* POPUP */
.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0);
background:white;
color:black;
padding:20px 30px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
transition:.3s;
z-index:999;
}

.popup.show{
transform:translate(-50%,-50%) scale(1);
}

/* LOADER */
.loader{
display:none;
margin-top:15px;
text-align:center;
}

.loader.show{
display:block;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes zoomBg{
from{
transform:scale(1.2);
}
to{
transform:scale(1);
}
}

</style>
</head>

</div>

</div>

<button

class="btn">

Daftar Sekarang

</button>

<button
type="button"

Daftar Dengan Google

Sudah punya akun?

<a href="login.html">

Masuk

</a>

</div>

</div>

</div>
